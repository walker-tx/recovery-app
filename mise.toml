#:schema https://mise.en.dev/schema/mise.json

min_version = "2026.7.6"

[settings]
pin = true

[tools]
node = "24.16.0"
"github:pnpm/pnpm" = "11.19.0"
pitchfork = "2.22.0"
mailpit = "1.31.0"

[tasks.zero]
description = "Prepare and start local development"
run = "./scripts/zero.sh"

[tasks."zero:tailnet"]
description = "Prepare and start local development for Expo Go over Tailscale"
run = "./scripts/zero-tailnet.sh"

[tasks.dev]
description = "Start Recovery development daemons"
run = "pitchfork start --group recovery"

[tasks.stop]
description = "Stop Recovery development daemons"
run = "./scripts/stop.sh"

[tasks.status]
description = "Show Recovery development daemon status"
run = "./scripts/status.sh"

[tasks.logs]
description = "Show Recovery development daemon logs"
run = "pitchfork logs mailpit backend mobile"

[tasks.bootstrap-test]
description = "Test the zero bootstrap contract"
run = "./scripts/test-zero.sh && ./scripts/test-zero-tailnet.sh"

[tasks.install]
description = "Install workspace dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.format]
description = "Format owned JavaScript, TypeScript, and JSON files"
run = "pnpm run format"

[tasks.lint]
description = "Run strict Oxlint checks with zero warnings"
run = "pnpm run lint"

[tasks.check]
description = "Check formatting, lint, and workspace types"
run = "pnpm run check"

[tasks.doctor]
description = "Check Expo dependency and project health"
run = "pnpm run doctor"
